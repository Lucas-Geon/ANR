<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027년도 장기휴가 & 나이트킵 신청 프로그램</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #222; }
  .container { max-width: 1380px; margin: 0 auto; }

  /* 데스크톱 상단 고정 */
  .sticky-top { position: sticky; top: 0; z-index: 100; background: #f0f2f5; padding-bottom: 10px; }
  .header { background: #fff; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 10px; }
  .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .badge { padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
  .badge-round { background: #0056b3; color: #fff; }
  .badge-night { background: #6f42c1; color: #fff; }
  .badge-blind { background: #6c757d; color: #fff; }
  .badge-open { background: #28a745; color: #fff; }

  /* 공지사항 박스 */
  .notice-box { margin-top: 12px; padding: 11px 15px; background: #fff9db; border: 1px solid #ffe066; border-left: 4px solid #f59f00; border-radius: 6px; font-size: 13.5px; line-height: 1.55; color: #333; }
  .notice-header { font-weight: bold; color: #d9480f; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .notice-content { white-space: pre-wrap; word-break: keep-all; }
  .notice-editor { width: 100%; min-height: 76px; padding: 8px 10px; border: 1px solid #f59f00; border-radius: 6px; font-family: inherit; font-size: 13.5px; line-height: 1.5; margin-top: 6px; resize: vertical; }

  .form-box { background: #fff; padding: 14px 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .form-inputs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { background: #0056b3; color: #fff; border: none; cursor: pointer; font-weight: bold; transition: 0.15s; }
  button:hover { background: #004494; }
  button:disabled { background: #999; cursor: not-allowed; }
  button.btn-night { background: #6f42c1; }
  button.btn-night:hover { background: #59339d; }
  button.btn-danger { background: #dc3545; padding: 2px 6px; font-size: 11px; border-radius: 4px; }
  button.btn-success { background: #28a745; padding: 2px 6px; font-size: 11px; border-radius: 4px; }

  .month-nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .month-nav a { text-decoration: none; background: #fff; color: #333; border: 1px solid #ddd; padding: 5px 9px; border-radius: 6px; font-size: 12px; font-weight: bold; }
  .month-nav a:hover { background: #0056b3; color: #fff; border-color: #0056b3; }

  .admin-panel { background: #343a40; color: #fff; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .loading-overlay { font-size: 13px; color: #0056b3; font-weight: bold; margin-left: 8px; }

  /* 나이트킵 월별 신청 현황 보드 */
  .night-board { background: #fff; border: 2px solid #d0bfff; border-radius: 10px; padding: 15px 20px; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(111, 66, 193, 0.08); }
  .night-board-title { font-size: 16px; font-weight: bold; color: #5f3dc4; margin: 0 0 12px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .night-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .night-month-card { background: #f8f5ff; border: 1px solid #e5dbff; border-radius: 8px; padding: 10px; font-size: 13px; }
  .night-month-card.over { border-color: #dc3545; background: #fff5f5; }
  .night-m-header { font-weight: bold; color: #3b287c; border-bottom: 1px solid #e5dbff; padding-bottom: 4px; margin-bottom: 6px; }
  .night-row { margin-top: 4px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

  /* 12개월 캘린더 그리드 */
  .months-wrapper { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  @media (max-width: 1024px) { .months-wrapper { grid-template-columns: 1fr; } }

  .month-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); overflow: hidden; border: 1px solid #dce1e7; scroll-margin-top: 250px; }
  .month-header { background: #2c3e50; color: #fff; padding: 10px 15px; font-size: 17px; font-weight: bold; text-align: center; letter-spacing: 1px; }

  .dow-row { display: grid; grid-template-columns: repeat(7, 1fr); background: #f8f9fa; border-bottom: 1px solid #dee2e6; text-align: center; font-weight: bold; font-size: 13px; padding: 6px 0; }
  .dow-sun { color: #e03131; }
  .dow-sat { color: #1971c2; }

  .week-block { border-bottom: 1px solid #dee2e6; transition: 0.15s; position: relative; }
  .week-block:last-child { border-bottom: none; }
  .week-block.selectable { cursor: pointer; }
  .week-block.selectable:hover { background: #f1f7ff; }
  .week-block.selected { background: #e3f0ff; outline: 2px solid #0056b3; z-index: 2; }
  .week-block.over-limit { background: #fff5f5; outline: 2px solid #dc3545; z-index: 1; }
  .week-block.disabled-week { background: #fafafa; opacity: 0.65; cursor: not-allowed; }

  .days-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding: 6px 0 4px 0; font-size: 14px; font-weight: bold; }
  .day-cell { position: relative; padding: 2px 0; }
  .day-other-month { color: #bbb; font-weight: normal; }
  .day-sun, .day-holiday { color: #e03131; }
  .day-sat { color: #1971c2; }
  .holiday-name { display: block; font-size: 10px; font-weight: normal; color: #e03131; line-height: 1.1; margin-top: 1px; }
  .weekday-highlight { background: rgba(0, 86, 179, 0.05); border-radius: 4px; }

  .week-status-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px 7px 10px; font-size: 12px; gap: 6px; border-top: 1px dashed #e9ecef; flex-wrap: wrap; }
  .week-tag { font-weight: bold; color: #495057; background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap; }
  .week-block.selected .week-tag { background: #0056b3; color: #fff; }
  .week-block.over-limit .week-tag { background: #dc3545; color: #fff; }

  .part-boxes { display: flex; gap: 6px; flex: 1; justify-content: flex-end; flex-wrap: wrap; }
  .part-box { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px; padding: 3px 7px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .part-title { font-weight: bold; color: #333; }
  .over-text { color: #dc3545; font-weight: bold; }
  .person-chip { display: inline-flex; align-items: center; gap: 3px; background: #fff; border: 1px solid #ced4da; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .person-chip.confirmed { background: #ebfbee; border-color: #40c057; font-weight: bold; }
  .person-chip.night-chip { background: #f3f0ff; border-color: #9775fa; color: #5f3dc4; font-weight: bold; }

  /* 공지사항 1회 팝업 모달 */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px; }
  .modal-card { background: #fff; width: 100%; max-width: 420px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); overflow: hidden; animation: popIn 0.2s ease-out; }
  @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-head { background: #2c3e50; color: #fff; padding: 14px 18px; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
  .modal-body { padding: 18px; font-size: 14.5px; line-height: 1.65; color: #222; white-space: pre-wrap; background: #fffdf5; }
  .modal-foot { padding: 12px 18px; background: #f8f9fa; text-align: right; border-top: 1px solid #eee; }
  .modal-foot button { width: 100%; padding: 10px; font-size: 15px; background: #0056b3; }

  /* 모바일 최적화 (상단 틀고정 해제) */
  @media (max-width: 768px) {
    body { padding: 10px; }
    .sticky-top { position: static !important; }
    .month-card { scroll-margin-top: 12px; }
    .header { padding: 12px 14px; }
    .header h2 { font-size: 17px !important; }
    .form-box { padding: 12px 14px; }
    .form-inputs { width: 100%; }
    .form-inputs select,
    .form-inputs input,
    .form-inputs button { width: 100% !important; }
    .night-board { padding: 12px 14px; }
    .night-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .week-status-bar { padding: 5px 8px 6px 8px; }
    .part-boxes { justify-content: flex-start; }
  }
</style>
</head>
<body>

<!-- 방문 시 1회 표출되는 공지사항 팝업 -->
<div id="noticeModal" class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-head">📢 공지사항 안내</div>
    <div id="modalNoticeText" class="modal-body"></div>
    <div class="modal-foot">
      <button onclick="closeNoticeModal()">확인했습니다</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="sticky-top" id="topFormArea">
    <div class="header">
      <div class="header-top">
        <div>
          <h2 style="margin:0 0 6px 0; font-size:20px;">📅 2027년 장기휴가 & 🌙 나이트킵 신청 프로그램</h2>
          <span id="roundBadge" class="badge badge-round">로딩중...</span>
          <span id="modeBadge" class="badge badge-blind">상태 확인중...</span>
          <span id="loadingMsg" class="loading-overlay"></span>
        </div>
        <div>
          <button onclick="fetchData()" style="background:#17a2b8; margin-right:5px;">새로고침</button>
          <button id="adminToggleBtn" onclick="toggleAdminMode()" style="background:#6c757d;">관리자 모드</button>
        </div>
      </div>

      <!-- 공지사항 칸 -->
      <div class="notice-box">
        <div class="notice-header">
          <span>📢 [공지사항]</span>
          <button id="saveNoticeBtn" onclick="saveNotice()" style="display:none; background:#e67700; padding:4px 10px; font-size:12px;">공지 저장</button>
        </div>
        <div id="noticeDisplay" class="notice-content"></div>
        <textarea id="noticeEditor" class="notice-editor" style="display:none;" placeholder="공지사항 내용을 자유롭게 입력하세요..."></textarea>
      </div>
    </div>

    <!-- 관리자 제어 패널 -->
    <div id="adminPanel" class="admin-panel" style="display:none;">
      <span>🔧 <strong>진행 단계 제어:</strong></span>
      <button onclick="adminAction('TOGGLE_OPEN')" style="background:#20c997;">블라인드 / 전체공개 전환</button>
      <button onclick="adminAction('SET_ROUND', '1')">① 1차 신청 (장기+나이트)</button>
      <button onclick="adminAction('SET_ROUND', 'NIGHT_WEEK')" style="background:#6f42c1;">② 나이트 당첨자 주차선택</button>
      <button onclick="adminAction('SET_ROUND', '2')">③ 2차 장기휴가 신청</button>
    </div>

    <!-- 통합 신청 폼 -->
    <div class="form-box">
      <div class="form-inputs">
        <select id="applyType" onchange="toggleFormMode()" style="font-weight:bold; border-color:#0056b3;">
          <option value="LEAVE">🏖️ 장기휴가 신청 (1순위)</option>
          <option value="NIGHT_APPLY">🌙 나이트킵 신청 (1차 희망월)</option>
          <option value="NIGHT_WEEK">🌙 나이트 당첨자 오프주 선택</option>
        </select>

        <select id="part">
          <option value="1동">1동 (장기 2명 / 나이트 1명)</option>
          <option value="2동">2동 (장기 1명 / 나이트 1명)</option>
        </select>

        <input type="text" id="name" placeholder="이름 입력" maxlength="20" style="width:105px;">
        <input type="text" id="empId" placeholder="사번 입력" maxlength="20" style="width:115px;">

        <input type="text" id="selectedWeek" placeholder="달력에서 원하는 주 클릭" readonly style="background:#eef5ff; border-color:#0056b3; font-weight:bold; width:200px;">

        <select id="targetMonth" style="display:none; background:#f3f0ff; border-color:#6f42c1; font-weight:bold;">
          <option value="">-- 희망 월 선택 --</option>
          <option value="1월">1월 나이트킵</option><option value="2월">2월 나이트킵</option>
          <option value="3월">3월 나이트킵</option><option value="4월">4월 나이트킵</option>
          <option value="5월">5월 나이트킵</option><option value="6월">6월 나이트킵</option>
          <option value="7월">7월 나이트킵</option><option value="8월">8월 나이트킵</option>
          <option value="9월">9월 나이트킵</option><option value="10월">10월 나이트킵</option>
          <option value="11월">11월 나이트킵</option><option value="12월">12월 나이트킵</option>
        </select>

        <button id="submitBtn" onclick="submitForm()">신청하기</button>
      </div>
      <div class="month-nav" id="monthNav"></div>
    </div>
  </div>

  <!-- 월별 나이트킵 신청 & 추첨 현황 보드 -->
  <div class="night-board">
    <div class="night-board-title">
      <span>🌙 2027년 월별 나이트킵 신청 현황 (정원: 1동 1명 / 2동 1명)</span>
      <span style="font-size:12px; font-weight:normal; color:#666;">* 1차 희망 월 접수 → 추첨 확정 후 오프 주 선택</span>
    </div>
    <div id="nightGrid" class="night-grid"></div>
  </div>

  <!-- 1월~12월 달력 영역 -->
  <div id="monthsContainer" class="months-wrapper"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjHtSy28K73WCFTHwcY3OrEaoADXt1mWErecx9KThrNzr8wWQc6OUpy4owW889vlE/exec';

// 백엔드(Code.gs)의 DEFAULT_NOTICE와 동일하게 유지
const DEFAULT_NOTICE = "1. 사번/이름 정확히 입력해주세요!\n2. 신청기간에는 자유롭게 수정 가능\n3. 2차 신청은 잔여석에 한해 선착순으로 완료됩니다";

let appData = { config: {}, data: [] };
let isAdmin = false;
let adminPw = '';
let selectedWeekLabel = '';
let currentNoticeText = '';

// 2027 공휴일 (※ 설·추석 등 변동 공휴일은 인사혁신처 고시로 최종 확인 권장)
const HOLIDAYS_2027 = {
  '1-1': '신정', '2-5': '설연휴', '2-6': '설날', '2-7': '설연휴', '2-8': '대체휴일',
  '3-1': '삼일절', '5-5': '어린이날', '5-13': '부처님오신날', '6-6': '현충일',
  '8-15': '광복절', '8-16': '대체휴일', '9-14': '추석연휴', '9-15': '추석', '9-16': '추석연휴',
  '10-3': '개천절', '10-4': '대체휴일', '10-9': '한글날', '10-11': '대체휴일',
  '12-25': '성탄절', '12-27': '대체휴일'
};

// HTML 이스케이프 (이름 등 사용자 입력을 innerHTML에 넣기 전에 반드시 통과)
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function build2027WeekMap() {
  const map = {};
  let current = new Date(2027, 0, 4);
  for (let w = 1; w <= 52; w++) {
    const mon = new Date(current);
    const fri = new Date(current);
    fri.setDate(mon.getDate() + 4);
    const label = `${w}주차 (${mon.getMonth()+1}/${mon.getDate()}~${fri.getMonth()+1}/${fri.getDate()})`;
    const key = `${mon.getFullYear()}-${mon.getMonth()+1}-${mon.getDate()}`;
    map[key] = { weekNum: w, label, mon, fri };
    current.setDate(current.getDate() + 7);
  }
  return map;
}

const WEEK_MAP_BY_MON = build2027WeekMap();

function initMonthNav() {
  const nav = document.getElementById('monthNav');
  for (let m = 1; m <= 12; m++) {
    const a = document.createElement('a');
    a.href = `#month-${m}`;
    a.innerText = `${m}월`;
    nav.appendChild(a);
  }
}

function toggleFormMode() {
  const type = document.getElementById('applyType').value;
  const weekInput = document.getElementById('selectedWeek');
  const monthSelect = document.getElementById('targetMonth');
  const partSelect = document.getElementById('part');
  const btn = document.getElementById('submitBtn');

  if (type === 'NIGHT_APPLY') {
    weekInput.style.display = 'none';
    monthSelect.style.display = 'inline-block';
    partSelect.style.display = 'inline-block';
    btn.innerText = '나이트킵 신청';
    btn.className = 'btn-night';
  } else if (type === 'NIGHT_WEEK') {
    weekInput.style.display = 'inline-block';
    monthSelect.style.display = 'none';
    partSelect.style.display = 'none';
    btn.innerText = '나이트 오프주 확정';
    btn.className = 'btn-night';
  } else {
    weekInput.style.display = 'inline-block';
    monthSelect.style.display = 'none';
    partSelect.style.display = 'inline-block';
    btn.innerText = '장기휴가 신청';
    btn.className = '';
  }
}

function setLoading(isLoading, text = '동기화 중...') {
  document.getElementById('loadingMsg').innerText = isLoading ? text : '';
}

// 공지사항 팝업 (방문 시 1회, 내용이 바뀌면 다시 1회)
function safeStorageGet(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }
function safeStorageSet(key, val) { try { sessionStorage.setItem(key, val); } catch (e) {} }

function showNoticePopupIfFirstVisit(noticeText) {
  currentNoticeText = noticeText;
  if (safeStorageGet('anr_notice_seen') !== noticeText) {
    document.getElementById('modalNoticeText').innerText = noticeText;
    document.getElementById('noticeModal').style.display = 'flex';
  }
}

function closeNoticeModal() {
  safeStorageSet('anr_notice_seen', currentNoticeText);
  document.getElementById('noticeModal').style.display = 'none';
}

function syncNoticeUI() {
  const noticeText = (appData.config && appData.config.notice) ? appData.config.notice : DEFAULT_NOTICE;
  document.getElementById('noticeDisplay').innerText = noticeText;
  document.getElementById('noticeEditor').value = noticeText;

  if (isAdmin) {
    document.getElementById('noticeDisplay').style.display = 'none';
    document.getElementById('noticeEditor').style.display = 'block';
    document.getElementById('saveNoticeBtn').style.display = 'inline-block';
  } else {
    document.getElementById('noticeDisplay').style.display = 'block';
    document.getElementById('noticeEditor').style.display = 'none';
    document.getElementById('saveNoticeBtn').style.display = 'none';
  }
}

function setAdminUI(on) {
  isAdmin = on;
  if (!on) adminPw = '';
  document.getElementById('adminPanel').style.display = on ? 'flex' : 'none';
  document.getElementById('adminToggleBtn').innerText = on ? '관리자 모드 해제' : '관리자 모드';
}

async function fetchData() {
  setLoading(true);
  try {
    // 관리자 모드일 때만 비밀번호를 함께 보내 이름·사번 원문을 받아옴
    const url = (isAdmin && adminPw) ? `${SCRIPT_URL}?adminPw=${encodeURIComponent(adminPw)}` : SCRIPT_URL;
    const res = await fetch(url);
    const json = await res.json();
    if (!json || !json.config) throw new Error((json && json.message) || '응답 형식 오류');
    appData = json;

    // 관리자 인증 실패 시 관리자 모드 해제
    if (isAdmin && !appData.adminOk) {
      alert('관리자 비밀번호가 일치하지 않거나 인증이 차단되었습니다. 관리자 모드를 해제합니다.');
      setAdminUI(false);
      return await fetchData();
    }

    const roundBadge = document.getElementById('roundBadge');
    const applyTypeSelect = document.getElementById('applyType');
    const round = String(appData.config.round);

    if (round === 'NIGHT_WEEK') {
      roundBadge.innerText = '🌙 나이트킵 당첨자 오프주 선택 기간';
      roundBadge.className = 'badge badge-night';
      applyTypeSelect.value = 'NIGHT_WEEK';
    } else if (round === '2') {
      roundBadge.innerText = '2차 장기휴가 신청 기간 (잔여석 선착순)';
      roundBadge.className = 'badge badge-round';
      if (applyTypeSelect.value !== 'LEAVE') applyTypeSelect.value = 'LEAVE';
    } else {
      roundBadge.innerText = '1차 신청 기간 (장기휴가 + 나이트킵)';
      roundBadge.className = 'badge badge-round';
      if (applyTypeSelect.value === 'NIGHT_WEEK') applyTypeSelect.value = 'LEAVE';
    }
    toggleFormMode();

    const modeBadge = document.getElementById('modeBadge');
    modeBadge.innerText = appData.config.isOpen ? '결과 공개 (조정·추첨 모드)' : '블라인드 접수중';
    modeBadge.className = appData.config.isOpen ? 'badge badge-open' : 'badge badge-blind';

    syncNoticeUI();
    showNoticePopupIfFirstVisit(appData.config.notice || DEFAULT_NOTICE);

    renderNightBoard();
    renderCalendars();
  } catch (err) {
    alert('데이터를 불러오는 중 오류가 발생했습니다.\n' + (err && err.message ? err.message : ''));
    console.error(err);
  } finally {
    setLoading(false);
  }
}

function renderNightBoard() {
  const grid = document.getElementById('nightGrid');
  grid.innerHTML = '';

  const nightApps = appData.data.filter(d => d.type === '나이트킵' && d.status !== '탈락');

  for (let m = 1; m <= 12; m++) {
    const mStr = `${m}월`;
    const mList = nightApps.filter(d => d.week === mStr || d.week.includes(`[${mStr}나이트]`));
    const p1 = mList.filter(d => d.part === '1동');
    const p2 = mList.filter(d => d.part === '2동');

    const isOver = (p1.length > 1 || p2.length > 1);
    const card = document.createElement('div');
    card.className = `night-month-card ${isOver && appData.config.isOpen ? 'over' : ''}`;

    const formatNightPart = (list) => {
      if (!appData.config.isOpen && !isAdmin) {
        return `<span class="${list.length > 1 ? 'over-text' : ''}">${list.length}/1명</span>`;
      }
      if (list.length === 0) return '<span style="color:#aaa;">공석</span>';
      return list.map(item => {
        const dName = esc(isAdmin ? (item.realName || item.name) : item.name);
        const isConf = item.status === '확정';
        const weekChosen = item.week.includes('주차') ? `(${esc(item.week.split(' ')[0])})` : '';
        const btns = isAdmin ? `
          <button class="btn-success" onclick="updateStatus(${Number(item.rowIdx)}, '확정')">당첨</button>
          <button class="btn-danger" onclick="updateStatus(${Number(item.rowIdx)}, '탈락')">제외</button>
        ` : '';
        return `<span class="person-chip ${isConf ? 'night-chip' : ''}">${isConf ? '🌙' : ''}${dName}${weekChosen}${btns}</span>`;
      }).join('');
    };

    card.innerHTML = `
      <div class="night-m-header">${m}월 나이트킵 ${isOver && appData.config.isOpen ? '🚨추첨' : ''}</div>
      <div class="night-row"><strong>1동(1):</strong> ${formatNightPart(p1)}</div>
      <div class="night-row"><strong>2동(1):</strong> ${formatNightPart(p2)}</div>
    `;
    grid.appendChild(card);
  }
}

function renderCalendars() {
  const container = document.getElementById('monthsContainer');
  container.innerHTML = '';
  const dows = ['일', '월', '화', '수', '목', '금', '토'];

  for (let m = 0; m < 12; m++) {
    const monthCard = document.createElement('div');
    monthCard.className = 'month-card';
    monthCard.id = `month-${m + 1}`;

    let html = `<div class="month-header">2027년 ${m + 1}월</div>`;
    html += `<div class="dow-row">` + dows.map((d, i) =>
      `<div class="${i === 0 ? 'dow-sun' : i === 6 ? 'dow-sat' : ''}">${d}</div>`
    ).join('') + `</div>`;

    const firstDay = new Date(2027, m, 1);
    const lastDay = new Date(2027, m + 1, 0);
    let cursor = new Date(firstDay);
    cursor.setDate(firstDay.getDate() - firstDay.getDay());

    while (cursor <= lastDay) {
      const weekDays = [];
      for (let d = 0; d < 7; d++) {
        weekDays.push(new Date(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }

      const monday = weekDays[1];
      const monKey = `${monday.getFullYear()}-${monday.getMonth()+1}-${monday.getDate()}`;
      const weekInfo = WEEK_MAP_BY_MON[monKey];
      const isPrimaryMonthForWeek = (monday.getMonth() === m) || (m === 0 && weekInfo && weekInfo.weekNum === 1);
      const isValidWeek = Boolean(weekInfo) && isPrimaryMonthForWeek;

      let p1 = [], p2 = [], isOver = false;

      if (isValidWeek) {
        const weekApps = appData.data.filter(d => d.status !== '탈락' && d.week.startsWith(weekInfo.label));
        p1 = weekApps.filter(d => d.part === '1동');
        p2 = weekApps.filter(d => d.part === '2동');
        isOver = (p1.length > 2 || p2.length > 1);
      }

      const isSelected = isValidWeek && (selectedWeekLabel === weekInfo.label);
      const blockClass = [
        'week-block',
        isValidWeek ? 'selectable' : 'disabled-week',
        isSelected ? 'selected' : '',
        (isValidWeek && isOver && appData.config.isOpen) ? 'over-limit' : ''
      ].join(' ');

      const clickAttr = isValidWeek ? `onclick="selectWeek('${weekInfo.label}')"` : '';

      const daysHtml = weekDays.map((dt, idx) => {
        const isCurrentMonth = dt.getMonth() === m;
        const hKey = `${dt.getMonth()+1}-${dt.getDate()}`;
        const holiday = HOLIDAYS_2027[hKey];
        const isWeekday = idx >= 1 && idx <= 5 && isValidWeek;

        let cls = 'day-cell';
        if (!isCurrentMonth) cls += ' day-other-month';
        else if (idx === 0 || holiday) cls += ' day-sun';
        else if (idx === 6) cls += ' day-sat';
        if (isWeekday) cls += ' weekday-highlight';

        return `<div class="${cls}">
          ${dt.getDate()}
          ${holiday && isCurrentMonth ? `<span class="holiday-name">${holiday}</span>` : ''}
        </div>`;
      }).join('');

      let statusBarHtml = '';
      if (isValidWeek) {
        statusBarHtml = `
          <div class="week-status-bar">
            <span class="week-tag">${weekInfo.weekNum}주차 (${weekInfo.mon.getMonth()+1}/${weekInfo.mon.getDate()}~${weekInfo.fri.getMonth()+1}/${weekInfo.fri.getDate()}) ${isOver && appData.config.isOpen ? '🚨경합' : ''}</span>
            <div class="part-boxes">
              <div class="part-box">
                <span class="part-title">1동(2):</span>
                ${formatPartList(p1, 2)}
              </div>
              <div class="part-box">
                <span class="part-title">2동(1):</span>
                ${formatPartList(p2, 1)}
              </div>
            </div>
          </div>
        `;
      } else if (weekInfo && !isPrimaryMonthForWeek) {
        statusBarHtml = `
          <div class="week-status-bar" style="justify-content:center; color:#888; font-size:11px;">
            ↳ ${weekInfo.weekNum}주차 신청은 ${monday.getMonth()+1}월 달력에서 선택
          </div>
        `;
      }

      html += `<div class="${blockClass}" ${clickAttr}>
        <div class="days-row">${daysHtml}</div>
        ${statusBarHtml}
      </div>`;
    }

    monthCard.innerHTML = html;
    container.appendChild(monthCard);
  }
}

function formatPartList(list, limit) {
  if (!appData.config.isOpen && !isAdmin) {
    return `<span class="${list.length > limit ? 'over-text' : ''}">${list.length}/${limit}명</span>`;
  }
  if (list.length === 0) return `<span style="color:#aaa;">공석</span>`;

  return list.map(item => {
    const displayName = esc(isAdmin ? (item.realName || item.name) : item.name);
    const isNight = item.type === '나이트킵';
    const isConfirmed = item.status === '확정';
    const chipClass = isNight ? 'night-chip' : (isConfirmed ? 'confirmed' : '');
    const icon = isNight ? '🌙' : (isConfirmed ? '✅' : '');
    const suffix = isNight ? '(나이트)' : '';

    const adminBtns = (isAdmin && !isNight) ? `
      <button class="btn-success" onclick="event.stopPropagation(); updateStatus(${Number(item.rowIdx)}, '확정')">확정</button>
      <button class="btn-danger" onclick="event.stopPropagation(); updateStatus(${Number(item.rowIdx)}, '탈락')">제외</button>
    ` : '';

    return `<span class="person-chip ${chipClass}">${icon}${displayName}${suffix}${adminBtns}</span>`;
  }).join('');
}

function selectWeek(label) {
  selectedWeekLabel = label;
  document.getElementById('selectedWeek').value = label;
  renderCalendars();

  if (window.innerWidth <= 768) {
    document.getElementById('topFormArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

async function submitForm() {
  const applyType = document.getElementById('applyType').value;
  const part = document.getElementById('part').value;
  const name = document.getElementById('name').value.trim();
  const empId = document.getElementById('empId').value.trim();
  const week = document.getElementById('selectedWeek').value;
  const targetMonth = document.getElementById('targetMonth').value;

  if (!name || !empId) return alert('이름과 사번을 입력해주세요.');

  let payload = {};
  if (applyType === 'LEAVE') {
    if (!week) return alert('달력에서 원하는 주(월~금)를 클릭해주세요.');
    payload = { action: 'APPLY_LEAVE', part, empId, name, week };
  } else if (applyType === 'NIGHT_APPLY') {
    if (!targetMonth) return alert('나이트킵 희망 월을 선택해주세요.');
    payload = { action: 'APPLY_NIGHT', part, empId, name, targetMonth };
  } else if (applyType === 'NIGHT_WEEK') {
    if (!week) return alert('달력에서 나이트 오프로 사용할 주(월~금)를 클릭해주세요.');
    payload = { action: 'SELECT_NIGHT_WEEK', empId, name, week };
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  setLoading(true, '처리 중...');

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    alert(result.message);
    if (result.success) {
      document.getElementById('name').value = '';
      document.getElementById('empId').value = '';
      selectedWeekLabel = '';
      document.getElementById('selectedWeek').value = '';
      document.getElementById('targetMonth').value = '';
      await fetchData();
    }
  } catch (err) {
    alert('전송 중 오류가 발생했습니다.');
    console.error(err);
  } finally {
    btn.disabled = false;
    setLoading(false);
  }
}

async function toggleAdminMode() {
  if (isAdmin) {
    setAdminUI(false);
    await fetchData(); // 이름·사번 원문이 없는 일반 데이터로 다시 불러옴
    return;
  }
  const pw = prompt('관리자 비밀번호를 입력하세요:');
  if (!pw) return;
  adminPw = pw;
  setAdminUI(true);
  await fetchData(); // 서버가 비밀번호를 검증, 실패 시 fetchData가 관리자 모드를 해제
}

async function saveNotice() {
  const newNotice = document.getElementById('noticeEditor').value;
  setLoading(true, '공지사항 저장 중...');
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'SAVE_NOTICE', adminPw, notice: newNotice })
    });
    const result = await res.json();
    alert(result.message || '저장되었습니다.');
    if (result.success) await fetchData();
  } catch (err) {
    alert('공지 저장 중 오류가 발생했습니다.');
    console.error(err);
  } finally {
    setLoading(false);
  }
}

async function adminAction(action, round = null) {
  setLoading(true, '설정 변경 중...');
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, adminPw, round })
    });
    const result = await res.json();
    if (!result.success) return alert(result.message);
    await fetchData();
  } catch (err) {
    alert('설정 변경 중 오류가 발생했습니다.');
    console.error(err);
  } finally {
    setLoading(false);
  }
}

async function updateStatus(rowIdx, status) {
  if (!confirm(`해당 인원을 '${status}' 처리하시겠습니까?`)) return;
  setLoading(true, '상태 업데이트 중...');
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'UPDATE_STATUS', adminPw, rowIdx, status })
    });
    const result = await res.json();
    if (!result.success) return alert(result.message);
    await fetchData();
  } catch (err) {
    alert('상태 업데이트 중 오류가 발생했습니다.');
    console.error(err);
  } finally {
    setLoading(false);
  }
}

initMonthNav();
fetchData();
</script>
